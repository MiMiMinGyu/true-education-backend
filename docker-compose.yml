# 로컬 개발용 PostgreSQL. 다른 프로젝트의 DB와 겹치지 않도록 호스트 포트는 기본 5434를 사용합니다
# (5432·5433은 다른 로컬 PostgreSQL이 쓰는 경우가 많음. 바꾸려면 .env의 POSTGRES_PORT와 DATABASE_URL을 함께 수정).
name: true-education

services:
  postgres:
    image: postgres:16-alpine
    container_name: true-education-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yeoul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yeoul}
      POSTGRES_DB: ${POSTGRES_DB:-true_education}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
